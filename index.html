<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Santa Clara County Parks Trails and Points of Interest</title>

    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body>

    <header>
      <h1>Santa Clara County Parks Trails and Amenities</h1>
      <p>Trails and amenities in California's Santa Clara County Parks.  
        Click a trail for the trail name and details.
       Click an amenity for the amenity type and information.</p>
    </header>
    
    <arcgis-map basemap="topo-vector" center="-121.879, 37.155" zoom="11">
      <arcgis-zoom slot="top-left"></arcgis-zoom>
      <arcgis-home slot="top-left"></arcgis-home>
      <arcgis-search slot="top-right"></arcgis-search>
      <arcgis-expand slot="bottom-left" expand-tooltip="Legend" collapse-tooltip="Hide legend">
        <arcgis-legend></arcgis-legend>
      </arcgis-expand>
      <!-- <arcgis-layer-list slot="top-right"></arcgis-layer-list> -->
    </arcgis-map>

    <script type="module">
      const FeatureLayer = await $arcgis.import("@arcgis/core/layers/FeatureLayer.js");

      const viewElement = document.querySelector("arcgis-map");
      await viewElement.viewOnReady(); // Wait for the properties to be ready.

      // Configure the renderer to alter the symbol style, size breaks, and legend.
      const outline = { color: "#A9A9A9", width: 0.5 }; // autocasts as new SimpleLineSymbol()
      
      const UniqueValueRenderer = await $arcgis.import("@arcgis/core/renderers/UniqueValueRenderer.js"); // autocasts as new UniqueValueRenderer()
      const camp = { type: "simple-marker", style: "triangle", size: 8, color: "#684217ff", outline: {color: "#A9A9A9", width: 0.5} }; // autocasts as new SimpleMarkerSymbol()
      const rest = { type: "simple-marker", style: "square", size: 8, color: "#6780b0ff", outline: {color: "#A9A9A9", width: 0.5} };
      const restshower = { type: "simple-marker", style: "square", size: 8, color: "#8ac3d3ff", outline: {color: "#A9A9A9", width: 0.5} }; 
      const trailnopark = { type: "simple-marker", style: "circle", size: 8, color: "#b86b53ff", outline: {color: "#A9A9A9", width: 0.5} };
      const trailparklot = { type: "simple-marker", style: "circle", size: 8, color: "#3e756dff", outline: {color: "#A9A9A9", width: 0.5} };
      const trailroadpark = { type: "simple-marker", style: "circle", size: 8, color: "#d9d78cff", outline: {color: "#A9A9A9", width: 0.5} };

      
      const poi = new FeatureLayer({
        // Define the URL to the feature service containing the points of interest.
        url: "https://services1.arcgis.com/4QPaqCJqF1UIaPbN/arcgis/rest/services/Point_of_Interests/FeatureServer/0",
        title: "Santa Clara County Parks Points of Interest",
          // Define the renderer for the points of interest layer.
        renderer: {
          type: "unique-value", // autocasts as new UniqueValueRenderer()
          field: "type", // Specify the field to visualize.
          uniqueValueInfos: [
            {
              value: "CAMPGROUND", // features labeled as "CAMPGROUND"
            label: "Campground",  // will be displayed as Campground
              symbol: camp  // will be assigned camp
            }, {
              value: "RESTROOM",  // features labeled as "RESTROOM"
              label: "Restroom",  // will be displayed as Restroom
              symbol: rest  // will be assigned rest
            }, {
              value: "RESTROOM WITH SHOWER",  // features labeled as "RESTROOM WITH SHOWER"
              label: "Restroom with Shower",  // will be displayed as Restroom with Shower
              symbol: restshower  // will be assigned restshower
            }, {
              value: "TRAILHEAD WITH NO PARKING",  // features labeled as "TRAILHEAD WITH NO PARKING"
              label: "Trailhead with No Parking",  // will be displayed as Trailhead with No Parking
              symbol: trailnopark  // will be assigned trailnopark
            }, {
              value: "TRAILHEAD WITH PARKING LOT",  // features labeled as "TRAILHEAD WITH PARKING LOT"
              label: "Trailhead with Parking Lot",  // will be displayed as Trailhead with Parking Lot
              symbol: trailparklot  // will be assigned trailparklot
            }, {
              value: "TRAILHEAD WITH ROADSIDE PARKING",  // features labeled as "TRAILHEAD WITH ROADSIDE PARKING"
              label: "Trailhead with Roadside Parking",  // will be displayed as Trailhead with Roadside Parking
              symbol: trailroadpark  // will be assigned trailroadpark
            }
          ]
        },
        
        
        // Order features by type
        orderBy: [{ field: "type" }], // defaults to ascending
        
        popupTemplate: {
          title: "{type}", // Specify the popup title.
          content: [{ 
            type: "fields", 
            fieldInfos: [
              { fieldName: "park_name", label: "Park Name" },
              { fieldName: "name", label: "Name" },
              { fieldName: "description", label: "Description" },
              { fieldName: "amenities", label: "Amenities" },
            ]}], // Specify the fields to display.
        } // Add the renderer to load the symbol configuration.
      });

      const unpavtrail = { type: "simple-line", style: "short-dash", color: "#ad8b62ff", width: 1 }; // autocasts as new SimpleLineSymbol()
      const unpavroad = { type: "simple-line", style: "short-dash-dot", color: "#ad8b62ff", width: 1.5 }; // autocasts as new SimpleLineSymbol()
      const servroad = { type: "simple-line", style: "solid", color: "#666666ff", width: 2 }; // autocasts as new SimpleLineSymbol()
      const pavtrail = { type: "simple-line", style: "solid", color: "#666666ff", width: 1 }; // autocasts as new SimpleLineSymbol()
      const UniqueValueRenderer2 = await $arcgis.import("@arcgis/core/renderers/UniqueValueRenderer.js"); // autocasts as new UniqueValueRenderer()

      const trails = new FeatureLayer({
        url: "https://services1.arcgis.com/4QPaqCJqF1UIaPbN/arcgis/rest/services/Santa_Clara_County_Parks_Trails/FeatureServer/1",
        title: "Santa Clara County Parks Trails",

        renderer: {
          type: "unique-value", // autocasts as new UniqueValueRenderer()
          field: "route_type", // Specify the field to visualize.
          uniqueValueInfos: [
            {
              value: "Unpaved Trail", // features labeled as "Unpaved Trail"
              label: "Unpaved Trail",  // will be displayed as Unpaved Trail
              symbol: unpavtrail  // will be assigned a simple line symbol with color and width
            }, {
              value: "Unpaved Road",  // features labeled as "Unpaved Road"
              label: "Unpaved Road",  // will be displayed as Unpaved Road
              symbol: unpavroad  // will be assigned a simple line symbol with color and width
            }, {
              value: "Service Road",  // features labeled as "Service Road"
              label: "Service Road",  // will be displayed as Service Road
              symbol: servroad  // will be assigned a simple line symbol with color and width
            }, {
              value: "Paved Trail or Pathway",  // features labeled as "Paved Trail or Pathway"
              label: "Paved Trail or Pathway",  // will be displayed as Paved Trail or Pathway
              symbol: pavtrail  // will be assigned a simple line symbol with color and width
            }
          ]
          
        },

        popupTemplate: {
          title: "Trail Name: {TRAIL_NAME}",
          content: [
            {
              type: "fields",
              fieldInfos: [
                { fieldName: "park_name", label: "Park Name" },
                { fieldName: "public_use", label: "Public Use" },
                { fieldName: "dog_use", label: "Dog Use" },
                { fieldName: "surface", label: "Trail Surface" },
                { fieldName: "miles", label: "Length (mi)", format: { places: 3, digitSeparator: true } },
                { fieldName: "difficulty", label: "Difficulty" },
                { fieldName: "status", label: "Status" }
              ],
            },
          ],
        },
      })

      viewElement.map.add(poi); // Use the map property to add the layer.
      await viewElement.whenLayerView(poi); // Wait for the layer to be usable.

      // Zoom to the layer's full extent and customize the animation.
      await viewElement.goTo(poi.fullExtent, { animate: true, duration: 2500 });

      viewElement.map.add(trails); // Add the trails layer to the map.
    </script>
  </body>
</html>
